name: cuddly-waffle

services:
  front-end:
    build:
      dockerfile: front-end.dockerfile
      context: ./front-end
    ports:
      - 8080:3000

  database:
    build:
      dockerfile: postgres-local.dockerfile
      context: ./database
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - 5431:5432