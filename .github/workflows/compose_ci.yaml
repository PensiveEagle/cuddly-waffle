name: Continuous Integration for Docker Changes

on:
    pull_request:
        branches: [main]
        paths:
            - './docker/*'
    push:
        branches: [main]
        paths:
            - './docker/*'
    workflow_dispatch:

jobs:
    docker_compose_tests:
        runs-on: ubuntu-latest
        
        steps:
            - name: Docker Setup Buildx
              uses: docker/setup-buildx-action@v4

            - name: Checkout branch
              uses: actions/checkout@v7.0.1

            - name: Create test env file
              uses: SpicyPizza/create-envfile@v2.0
              with:
                envkey_POSTGRES_HOST: database
                envkey_POSTGRES_PORT: 5432
                envkey_POSTGRES_DB: gh_actions_test
                envkey_POSTGRES_USER: ghactionstest
                envkey_POSTGRES_PASSWORD: ghactionstest
                file_name: .env.local
                fail_on_empty: true

            - name: Docker Compose
              run: |
                docker compose up --build -d
                docker ps -a
                sleep 10
                docker ps -a
                docker compose down