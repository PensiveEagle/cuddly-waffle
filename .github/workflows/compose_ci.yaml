name: Continuous Integration for Docker Changes

on:
    pull_request:
        branches: [main]
        paths:
            - './docker/*'
    push:
        branches: [main]
        paths:
            - './docker/*'
    workflow_dispatch:

jobs:
    docker_compose_tests:
        runs-on: ubuntu-latest
        
        steps:
            - name: Docker Setup Buildx
              uses: docker/setup-buildx-action@v4

            - name: Checkout branch
              uses: actions/checkout@v7.0.1

            - name: Docker Compose
              run: |
                docker compose up --build -d
                docker ps -a
                sleep 10
                docker ps -a
                docker compose down