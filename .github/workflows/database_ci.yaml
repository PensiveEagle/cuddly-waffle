name: Continuous Integration Workflow for Database

on:
    pull_request:
        branches: [main]
        paths:
            - 'database/**'
    push:
        branches: [main]
        paths:
            - 'database/**'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build_and_run_docker_image:
        runs-on: ubuntu-latest

        steps:
            - name: Docker Setup Buildx
              uses: docker/setup-buildx-action@v4

            - name: Checkout branch
              uses: actions/checkout@v7.0.1
              
            - name: Build and export to Docker
              uses: docker/build-push-action@v7
              with:
                context: .
                file: ./docker/postgres-local.dockerfile
                load: true
                tags: test-image:test

            - name: Container test
              run: |
                docker run --name test-container -e POSTGRES_PASSWORD=password --rm -d test-image:test
                docker ps -a
                sleep 10
                docker ps -a
                docker stop test-container
            
